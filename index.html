<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cards-container">
        <article class="card card--hobby">
            <div class="card-body">
                <h2 class="card-title">Hobby</h2>
                <p class="card-price">Free</p>
                <p class="card-tagline">Ship solo.<br>No card.</p>
            </div>
            <button type="button" class="card-cta">Download</button>
        </article>
        <article class="card card--pro">
            <div class="card-body">
                <h2 class="card-title">Pro</h2>
                <p class="card-price">$20/mo</p>
                <p class="card-tagline">Power user.<br>Unlimited tabs.</p>
            </div>
            <button type="button" class="card-cta">Get Pro</button>
        </article>
        <article class="card card--business">
            <div class="card-body">
                <h2 class="card-title">Business</h2>
                <p class="card-price">$40/mo</p>
                <p class="card-tagline">Teams &amp; billing.<br>SSO ready.</p>
            </div>
            <button type="button" class="card-cta">Get Business</button>
        </article>
    </div>
</body>
</html>
